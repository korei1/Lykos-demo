name: PixiJS browser smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pixi-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install
      - name: Install Playwright for browser testing
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build application
        run: npm run build
      - name: Test PixiJS in Chromium
        run: node scripts/pixi-smoke-test.mjs
      - name: Upload test screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lykos-pixi-browser-test
          path: test-results/
          if-no-files-found: ignore
